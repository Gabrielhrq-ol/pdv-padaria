{% extends "base.html" %}

{% block title %}Entrar &middot; João &amp; Maria{% endblock %}
{% block body_class %}login-body-v2{% endblock %}

{% block body %}
<main class="login-wrapper-v2">
  <a href="/" class="login-back">&larr; voltar</a>

  <div class="login-card-v2">
    <img src="/static/img/logo.png" alt="João &amp; Maria" class="login-logo-img">

    <h1>Painel do dono</h1>
    <p class="login-sub-v2">Selecione quem vai entrar</p>

    <div id="admins-list" class="admins-list" aria-busy="true">
      <p class="admins-loading">Carregando...</p>
    </div>

    <div id="erro-login" class="erro-form" hidden></div>

    <footer class="login-footer-v2">
      <small>{{ env }}</small>
    </footer>
  </div>
</main>
<script src="/static/js/login.js"></script>
{% endblock %}
